<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기념품 수령 확인 - Iframe</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        iframe {
            width: 100%;
            height: 600px;
            border: none;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

<div class="container">
    <h4 class="text-center mb-4">🎁총회 대체 기념품 대상 조회 및 수령 확인</h4>
    
    <iframe src="https://script.google.com/macros/s/AKfycbyRln-0T_o9Kd6F0_ufnDjO-UueNBoOxL8ljXx0hL45MRThfs2b2GE4eNf39zRK1GAW/exec" 
            allowfullscreen>
    </iframe>

    <div class="text-center mt-3">
        <button class="btn btn-primary" onclick="reloadIframe()">🔂페이지 새로고침</button>
    </div>
</div>

<script>
    function reloadIframe() {
        document.querySelector('iframe').src += '';
    }
</script>

</body>
</html>
