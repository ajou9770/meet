<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>정기이사회 참석 자동 문자</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: sans-serif;
      background: #f5f5f5;
      text-align: center;
      padding-top: 100px;
    }
  </style>
  <script>
    window.onload = () => {
      const message = encodeURIComponent("선약 등으로 정기이사회 불참예정입니다");
      const phone = "01063542163"; // 수신자 전화번호

      // 디바이스 종류 확인
      const ua = navigator.userAgent.toLowerCase();
      let smsLink = "";

      if (/iphone|ipad|ipod/.test(ua)) {
        // iOS는 '&body='로 연결해야 작동하는 경우가 많음
        smsLink = `sms:${phone}&body=${message}`;
      } else if (/android/.test(ua)) {
        // Android는 '?body='가 안정적으로 작동
        smsLink = `sms:${phone}?body=${message}`;
      } else {
        // 기타 환경 (PC 등): 안내만
        document.getElementById("status").textContent = "⚠️ 단, 문자앱 실행을 통한 메세지 전송은 모바일(PAD)에서만 작동합니다.";
        return;
      }

      // 문자앱 실행
      window.location.href = smsLink;

      // 안내 메시지
      setTimeout(() => {
        document.getElementById("status").textContent =
          "📨 문자 메시지 앱이 열리지 않는 경우, 수동으로 전송해주세요.";
      }, 3000);
    };
  </script>
</head>
<body>
  <h2>📢 정기이사회 불참 문자가 자동으로 전송됩니다.</h2>
 <strong><p id="status" style="margin-top: 20px; color: #555; background-color: beige;"></p></strong>
</body>
</html>
