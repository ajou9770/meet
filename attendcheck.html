<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>신협임원참석 여부회신</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="container mt-5">
    <div class="card p-4 shadow-sm">
      <h3 class="mb-4">| 임원 상견레 참석 여부 회신 |</h3>
      <h6>📆 2025년 3월 4일(화) 17:30~<br><br>
      ⛳ 사계 (구, 달보드레)  
    </h6>
    <br>
      <form id="attendanceForm">
        <div class="mb-3">
          <!-- <label for="name" class="form-label">✨이름 선택:</label> -->
          <select id="name" name="name" class="form-select" required>
            <option value="">✨임원선택</option>
            <option value="임문채 (부이사장)">임문채 (부이사장)</option>
            <option value="길민주 (이사)">길민주 (이사)</option>            
            <option value="박정수 (이사)">박정수 (이사)</option>
            <option value="용창화 (이사)">용창화 (이사)</option>
            <option value="이기명 (이사)">이기명 (이사)</option>
            <option value="이상진 (이사)">이상진 (이사)</option>
            <option value="이지현 (이사)">이지현 (이사)</option>
            <option value="정서진 (이사)">정서진 (이사)</option>
            <option value="이학봉 (감사)">이학봉 (감사)</option>
            <option value="박안태 (감사)">박안태 (감사)</option>
            <option value="정망래 (감사)">정망래 (감사)</option>
            
          </select>
        </div>
        
        <div class="mb-3">
          <!-- <label for="attendance" class="form-label">✔참석 여부:</label> -->
          <select id="attendance" name="attendance" class="form-select" required>
            <option value="">✔참석 여부?</option>
            <option value="참석">참석</option>
            <option value="불참">불참</option>
            <option value="미정">현재미정(?)</option>
          </select>
        </div>
        
        <button type="submit" id="submitBtn" class="btn btn-primary w-100">📧회신하기</button>
      </form>
    </div>
    
    <script>
      document.getElementById("attendanceForm").onsubmit = function(event) {
        event.preventDefault();
        
        var submitBtn = document.getElementById("submitBtn");
        submitBtn.textContent = "🔄전송중.. 잠시만 기다려주세요";
        submitBtn.disabled = true;
        
        var formData = new FormData(document.getElementById("attendanceForm"));
        var attendanceValue = document.getElementById("attendance").value;
        alert('🤷‍♂️회신중입니다. 잠시 후 회신결과를 확인해 주세요');
        fetch("https://script.google.com/macros/s/AKfycby4XHSzq0IwSB5UKPq5TrJaCt1DFGFETD-MdfCeslNUa_YNesLzYiW4xLTiB5gmcgRi/exec", {
          method: "POST",
          body: formData
        })
        .then(response => response.text())
        .then(data => {
          alert(data);
          
          // 참석 여부가 "참석" 또는 "미정"인 경우 일정 추가 여부 확인
          if (attendanceValue === "참석" || attendanceValue === "미정")  {
            if (confirm("📆일정에 추가하시겠습니까?")) {
              alert('📤일정이 열리면 저장해 주세요');  
              addEventToCalendar();
            }
          }
        })
        .catch(error => {
          console.error("Error:", error);
          alert("⚠회신을 전송하는 동안 오류가 발생했습니다.");
        })
        .finally(() => {
          submitBtn.textContent = "📧회신하기";
          submitBtn.disabled = false;
        });
      };
      
      function addEventToCalendar() {
         // 로딩 메시지 추가
         var loadingOverlay = document.createElement('div');
         loadingOverlay.id = 'loadingOverlay';
         loadingOverlay.style.position = 'fixed';
         loadingOverlay.style.top = '0';
         loadingOverlay.style.left = '0';
         loadingOverlay.style.width = '100%';
         loadingOverlay.style.height = '100%';
         loadingOverlay.style.backgroundColor = 'rgba(0, 0, 0, 0.5)';
         loadingOverlay.style.display = 'flex';
         loadingOverlay.style.justifyContent = 'center';
         loadingOverlay.style.alignItems = 'center';
         loadingOverlay.style.color = 'white';
         loadingOverlay.style.fontSize = '1.4rem';
         loadingOverlay.textContent = '📝일정앱으로 이동중입니다▶▶▶';
         document.body.appendChild(loadingOverlay);
        const title = "신협 임원상견례 모임";
        const startDate = new Date("2025-03-04T17:30:00");
        const endDate = new Date("2025-03-04T19:00:00");
        const description = "신협 신임임원 취임관련 임직원 상견례 (장소: 사계)";
        const location = "";
        
        function formatDate(date) {
          return date.toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
        }
        
        const startDateStr = formatDate(startDate);
        const endDateStr = formatDate(endDate);
        
        if (/android/i.test(navigator.userAgent)) {
          const googleCalendarUrl = `https://www.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${startDateStr}/${endDateStr}&details=${encodeURIComponent(description)}&location=${encodeURIComponent(location)}`;
          window.location.href = googleCalendarUrl;
        } else if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
          const appleCalendarUrl = `webcal://www.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${startDateStr}/${endDateStr}&details=${encodeURIComponent(description)}&location=${encodeURIComponent(location)}`;
          window.location.href = appleCalendarUrl;
        } else {
          alert("⚠현재 사용하는 기기에서는 자동 일정 추가가 지원되지 않습니다.");
        }
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
