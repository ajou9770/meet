<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>전자 리플릿(한면 보기) 샘플</title>

  <style>
    :root{
      --bg:#0b1220;
      --card:#ffffff;
      --ink:#0f172a;
      --muted:#64748b;
      --line:rgba(15,23,42,.10);
      --shadow: 0 18px 40px rgba(0,0,0,.35);
      --radius: 18px;
      --accent:#4f46e5;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", "Apple SD Gothic Neo", Arial, sans-serif;
      background:
        radial-gradient(1200px 600px at 20% -10%, rgba(79,70,229,.35), transparent 55%),
        radial-gradient(900px 450px at 100% 0%, rgba(34,197,94,.22), transparent 55%),
        linear-gradient(180deg, #050816 0%, var(--bg) 40%, #050816 100%);
      color:#e5e7eb;
      min-height:100vh;
      padding-bottom: calc(84px + env(safe-area-inset-bottom));
    }

    /* Top bar */
    .topbar{
      position: sticky; top:0; z-index: 20;
      backdrop-filter: blur(12px);
      background: rgba(5,8,22,.55);
      border-bottom: 1px solid rgba(255,255,255,.08);
    }
    .topbar .wrap{
      max-width: 980px; margin: 0 auto;
      padding: 12px 14px;
      display:flex; align-items:center; justify-content:space-between; gap:10px;
    }
    .brand{ display:flex; align-items:center; gap:10px; min-width:0; }
    .logo{
      width:34px; height:34px; border-radius:12px;
      background: linear-gradient(135deg, rgba(79,70,229,.9), rgba(34,197,94,.75));
      box-shadow: 0 0 0 6px rgba(79,70,229,.18);
      flex: 0 0 auto;
    }
    .brand .title{ font-weight: 900; letter-spacing:-.02em; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .brand .sub{ color: rgba(229,231,235,.72); font-size:12px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    .actions{ display:flex; gap:8px; flex: 0 0 auto; }
    .btn{
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color:#fff;
      border-radius: 999px;
      padding: 9px 12px;
      font-weight: 900;
      font-size: 13px;
      cursor: pointer;
      transition: .15s ease;
    }
    .btn:hover{ transform: translateY(-1px); background: rgba(255,255,255,.10); }
    .btn.primary{ background: rgba(79,70,229,.95); border-color: rgba(79,70,229,.25); }

    .stage{ max-width: 980px; margin: 0 auto; padding: 16px 14px 8px; }
    .hint{
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      margin: 6px 2px 12px;
      color: rgba(229,231,235,.72); font-size:12px;
    }
    .hint b{ color:#fff; }

    /* ✅ Single-page viewport: always one page */
    .viewer{
      display:flex; justify-content:center; align-items:center;
      padding: 10px 0 16px;
    }
    .page-shell{
      width: min(92vw, 440px);         /* 모바일에 안전 */
      height: min(70vh, 640px);        /* ✅ 세로 기준으로도 안정 */
      position: relative;
      perspective: 1200px;
      user-select:none; -webkit-user-select:none;
      touch-action: pan-y;
    }

    /* two layers for animation (current + next) */
    .page{
      position:absolute; inset:0;
      background: var(--card);
      color: var(--ink);
      border-radius: var(--radius);
      overflow:hidden;
      border: 1px solid rgba(15,23,42,.06);
      box-shadow: var(--shadow);
      transform-origin: left center;
      backface-visibility: hidden;
      display:flex;
    }

    /* content layout */
    .p-wrap{
      height:100%;
      width:100%;
      display:flex;
      flex-direction:column;
      padding: 18px 16px;
    }
    .p-top{
      display:flex; justify-content:space-between; align-items:flex-start; gap:12px;
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(79,70,229,.08);
      border: 1px solid rgba(79,70,229,.18);
      color:#3730a3;
      font-weight: 950;
      font-size: 12px;
      white-space: nowrap;
    }
    .p-num{
      color: var(--muted);
      font-weight: 900;
      font-size: 12px;
      white-space: nowrap;
    }
    h1,h2{ margin:0; letter-spacing:-.03em; }
    h1{ font-size: 22px; }
    h2{ font-size: 18px; }
    p{ margin:0; line-height:1.55; color:#1f2937; }
    .muted{ color: var(--muted); }

    .hero{
      margin-top: 14px;
      border-radius: 16px;
      padding: 14px;
      background:
        radial-gradient(700px 220px at 20% 0%, rgba(79,70,229,.18), transparent 60%),
        linear-gradient(180deg, rgba(15,23,42,.04), rgba(15,23,42,.02));
      border: 1px solid var(--line);
    }
    .grid{
      margin-top: 12px;
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:10px;
    }
    .card{
      border-radius: 16px;
      border: 1px solid var(--line);
      padding: 12px;
      background:#fff;
    }
    .card .k{ font-size: 12px; color: var(--muted); font-weight: 900; }
    .card .v{ margin-top: 4px; font-weight: 950; font-size: 16px; }
    ul{ margin: 10px 0 0 18px; color:#111827; line-height:1.6; padding:0; }
    .spacer{ flex:1; }
    .footer{
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      padding-top: 10px;
      border-top: 1px dashed var(--line);
      margin-top: 14px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    /* Animations */
/* ✅ 더 천천히, 책장 넘김 체감 강화 */
.anim-next-out{ animation: nextOut 900ms cubic-bezier(.18,.85,.18,1) forwards; }
.anim-next-in { animation: nextIn  900ms cubic-bezier(.18,.85,.18,1) forwards; }
.anim-prev-out{ animation: prevOut 900ms cubic-bezier(.18,.85,.18,1) forwards; }
.anim-prev-in { animation: prevIn  900ms cubic-bezier(.18,.85,.18,1) forwards; }

    @keyframes nextOut{
  0%   { transform: rotateY(0deg) translateX(0) scale(1); opacity:1; }
  60%  { transform: rotateY(-22deg) translateX(-10px) scale(.992); opacity:.65; }
  100% { transform: rotateY(-28deg) translateX(-16px) scale(.985); opacity:0; }
}
@keyframes nextIn{
  0%   { transform: translateX(26px) scale(.985); opacity:0; }
  60%  { transform: translateX(8px)  scale(.995); opacity:.65; }
  100% { transform: translateX(0)    scale(1);    opacity:1; }
}
@keyframes prevOut{
  0%   { transform: rotateY(0deg) translateX(0) scale(1); opacity:1; }
  60%  { transform: rotateY(22deg) translateX(10px) scale(.992); opacity:.65; }
  100% { transform: rotateY(28deg) translateX(16px) scale(.985); opacity:0; }
}
@keyframes prevIn{
  0%   { transform: translateX(-26px) scale(.985); opacity:0; }
  60%  { transform: translateX(-8px)  scale(.995); opacity:.65; }
  100% { transform: translateX(0)      scale(1);    opacity:1; }
}

    /* Bottom nav */
    .bottom-nav{
      position: fixed; left:0; right:0; bottom:0; z-index: 30;
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      backdrop-filter: blur(12px);
      background: rgba(5,8,22,.62);
      border-top: 1px solid rgba(255,255,255,.08);
    }
    .bottom-nav .wrap{
      max-width: 980px; margin: 0 auto;
      display:flex; gap:10px; align-items:center; justify-content:space-between;
    }
    .nav-left,.nav-right{ display:flex; gap:10px; align-items:center; }
    .navbtn{
      width: 48px; height: 44px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color:#fff;
      font-size: 16px;
      cursor:pointer;
      transition:.15s ease;
    }
    .navbtn:disabled{ opacity:.35; cursor:not-allowed; }
    .navbtn:hover:not(:disabled){ transform: translateY(-1px); background: rgba(255,255,255,.10); }

    .pager{
      display:flex;
      flex-direction: column;
      align-items:center;
      gap: 4px;
      min-width: 130px;
    }
    .pager .t{
      font-size: 12px;
      color: rgba(229,231,235,.8);
      font-weight: 900;
    }
    .bar{
      width: 160px; max-width: 46vw;
      height: 6px; border-radius:999px;
      background: rgba(255,255,255,.10);
      overflow:hidden;
      border: 1px solid rgba(255,255,255,.10);
    }
    .bar > i{
      display:block; height:100%; width:0%;
      background: rgba(79,70,229,.95);
    }
    .tap-hint{
      margin-top: 8px; text-align:center;
      font-size: 12px; color: rgba(229,231,235,.70);
    }
  </style>
</head>

<body>
  <div class="topbar">
    <div class="wrap">
      <div class="brand">
        <div class="logo" aria-hidden="true"></div>
        <div style="min-width:0">
          <div class="title">전자 리플릿 · 한면 보기(샘플)</div>
          <div class="sub">디바이스마다 잘림 없이 1페이지씩 표시</div>
        </div>
      </div>
      <div class="actions">
        <button class="btn" id="btnFullscreen">전체화면</button>
        <button class="btn primary" onclick="window.print()">PDF/인쇄</button>
      </div>
    </div>
  </div>

  <div class="stage">
    <div class="hint">
      <div>📌 <b>한 면씩</b> 넘기며 보는 전자 리플릿 (잘림 방지)</div>
      <div>※ 내용은 예시</div>
    </div>

    <div class="viewer">
      <div class="page-shell" id="shell" aria-label="Single Page Viewer">
        <div class="page" id="pageA"></div>
        <div class="page" id="pageB" style="display:none;"></div>
      </div>
    </div>

    <div class="tap-hint">📱 화면을 <b>좌우 스와이프</b>하거나 아래 버튼으로 넘겨보세요.</div>
  </div>

  <div class="bottom-nav">
    <div class="wrap">
      <div class="nav-left">
        <button class="navbtn" id="prevBtn" aria-label="이전">◀</button>
        <button class="navbtn" id="nextBtn" aria-label="다음">▶</button>
      </div>

      <div class="pager" aria-live="polite">
        <div class="t" id="pageText">Page 1 / 8</div>
        <div class="bar"><i id="progress"></i></div>
      </div>

      <div class="nav-right">
        <button class="btn" id="btnFirst">처음</button>
        <button class="btn primary" id="btnLast">끝</button>
      </div>
    </div>
  </div>

  <script>
    // ===== Pages (한면씩) =====
    const pages = [
      {
        pill: "표지 · 2026", h: "아주대의료원신협<br/>전자 리플릿",
        desc: "모바일에서 1페이지씩 넘기며 보는 책자형(샘플)",
        blocks: [
          ["핵심 혜택", "한눈에 요약"],
          ["가입 절차", "3단계 안내"],
          ["문의", "전화/채널"],
          ["QR", "바로가기"]
        ],
        footL: "Swipe ◀ ▶ or 버튼", footR: "01"
      },
      {
        pill: "목차", h: "이 리플릿에 담긴 내용",
        desc: "요약은 리플릿(웹), 상세 약관/설명서는 PDF로 연결하면 모바일에서 가장 편합니다.",
        list: ["상품 핵심 포인트 요약", "가입/신청 절차", "유의사항(중요)", "문의/바로가기(버튼/QR)"],
        footL: "다음 페이지에서 본문 시작", footR: "02"
      },
      {
        pill: "핵심 요약", h: "핵심 포인트 3가지",
        list: ["금리/혜택은 한 문장으로", "대상/조건은 카드로", "신청 버튼은 하단 고정(CTA)"],
        blocks: [["대상(예시)", "조합원"], ["기간(예시)", "~ 2026.02"]],
        footL: "핵심은 짧고 굵게", footR: "03"
      },
      {
        pill: "가입 절차", h: "가입/신청은 이렇게",
        steps: ["가입하기 버튼 클릭", "휴대폰 본인확인", "상품 선택 후 진행"],
        blocks: [["필요 서류(예시)", "없음/간편"], ["소요 시간(예시)", "3분 내"]],
        footL: "복잡하면 이탈합니다", footR: "04"
      },
      {
        pill: "유의사항", h: "꼭 읽어주세요",
        list: ["중도해지/만기 조건", "금리/혜택 적용 기준", "가입 제한/한도"],
        tip: "핵심 유의사항은 “3줄 요약” + “상세 PDF 링크” 조합이 베스트",
        footL: "신뢰는 디테일", footR: "05"
      },
      {
        pill: "문의/바로가기", h: "바로 실행 버튼",
        desc: "아래 버튼은 실제 운영 링크로 교체하세요.",
        ctas: true,
        footL: "버튼은 하단 고정 CTA로도 가능", footR: "06"
      },
      {
        pill: "마무리", h: "요약 한 줄",
        descStrong: "“모바일은 짧게, 클릭하면 상세로”가 가장 잘 먹힙니다.",
        desc: "필요하면 책자 PDF도 함께 제공하세요.",
        footL: "끝!", footR: "07"
      },
      {
        pill: "뒷표지", h: "감사합니다",
        desc: "문의: 010-0000-0000 · 카카오채널 · 홈페이지",
        footL: "© 아주대의료원신협", footR: "08"
      },
    ];

    let idx = 0;
    let busy = false;

    const pageA = document.getElementById('pageA');
    const pageB = document.getElementById('pageB');

    function pageHTML(p, pageNo, total){
      const blocks = (p.blocks || []).map(b => `
        <div class="card">
          <div class="k">${b[0]}</div>
          <div class="v">${b[1]}</div>
        </div>
      `).join('');

      const list = (p.list || []).map(x => `<li>${x}</li>`).join('');
      const steps = (p.steps || []).map((x,i) => `<p style="margin-top:${i?6:0}px;"><b>${i+1})</b> ${x}</p>`).join('');

      const tip = p.tip ? `
        <div class="card" style="margin-top:12px;">
          <div class="k">TIP</div>
          <div class="v" style="font-size:14px;">${p.tip}</div>
        </div>` : '';

      const heroInner = `
        ${p.descStrong ? `<p style="font-weight:950; font-size:16px;">${p.descStrong}</p>` : ''}
        ${p.desc ? `<p class="muted" style="margin-top:${p.descStrong?8:0}px;">${p.desc}</p>` : ''}
        ${p.steps ? `<div style="margin-top:10px;">${steps}</div>` : ''}
        ${p.list ? `<ul style="margin-top:${p.desc||p.descStrong?10:0}px;">${list}</ul>` : ''}
        ${p.ctas ? `
          <div style="display:grid; gap:10px; margin-top:10px;">
            <button class="btn primary" style="border-radius:16px; padding:12px 14px;"
              onclick="alert('여기에 가입/신청 링크 연결')">가입/신청 바로가기</button>
            <button class="btn" style="border-radius:16px; padding:12px 14px;"
              onclick="location.href='tel:01000000000'">전화 문의</button>
          </div>` : ''}
      `;

      return `
        <div class="p-wrap">
          <div class="p-top">
            <span class="pill">${p.pill || ''}</span>
            <div class="p-num">Page ${pageNo} / ${total}</div>
          </div>

          <div class="hero">
            <h1>${p.h || ''}</h1>
            ${heroInner}
          </div>

          ${blocks ? `<div class="grid">${blocks}</div>` : ''}

          ${tip}

          <div class="spacer"></div>
          <div class="footer">
            <span>${p.footL || ''}</span>
            <span>${p.footR || ''}</span>
          </div>
        </div>
      `;
    }

    function setIndicators(){
      const total = pages.length;
      const pageNo = idx + 1;
      document.getElementById("pageText").textContent = `Page ${pageNo} / ${total}`;
      const pct = ((pageNo - 1) / (total - 1)) * 100;
      document.getElementById("progress").style.width = `${pct}%`;

      document.getElementById("prevBtn").disabled = (idx === 0);
      document.getElementById("nextBtn").disabled = (idx === total - 1);
    }

    function renderInitial(){
      pageA.innerHTML = pageHTML(pages[idx], idx+1, pages.length);
      setIndicators();
    }

    function go(nextIdx){
      if (busy) return;
      if (nextIdx < 0 || nextIdx >= pages.length) return;
      if (nextIdx === idx) return;

      busy = true;

      const dir = nextIdx > idx ? 'next' : 'prev';
      const from = pageA.style.display === 'none' ? pageB : pageA;
      const to   = from === pageA ? pageB : pageA;

      to.style.display = 'flex';
      to.innerHTML = pageHTML(pages[nextIdx], nextIdx+1, pages.length);

      // animate
      from.classList.remove('anim-next-out','anim-prev-out','anim-next-in','anim-prev-in');
      to.classList.remove('anim-next-out','anim-prev-out','anim-next-in','anim-prev-in');

      if (dir === 'next'){
        from.classList.add('anim-next-out');
        to.classList.add('anim-next-in');
      } else {
        from.classList.add('anim-prev-out');
        to.classList.add('anim-prev-in');
      }

      setTimeout(() => {
        from.style.display = 'none';
        from.classList.remove('anim-next-out','anim-prev-out');
        to.classList.remove('anim-next-in','anim-prev-in');
        idx = nextIdx;
        setIndicators();
        busy = false;
      }, 920);
    }

    // Buttons
    document.getElementById("nextBtn").addEventListener("click", () => go(idx+1));
    document.getElementById("prevBtn").addEventListener("click", () => go(idx-1));
    document.getElementById("btnFirst").addEventListener("click", () => go(0));
    document.getElementById("btnLast").addEventListener("click", () => go(pages.length-1));

    // Swipe
    const shell = document.getElementById("shell");
    let x0=null, y0=null;
    shell.addEventListener("touchstart", (e) => {
      const t = e.touches[0];
      x0 = t.clientX; y0 = t.clientY;
    }, {passive:true});

    shell.addEventListener("touchend", (e) => {
      if (x0 === null) return;
      const t = e.changedTouches[0];
      const dx = t.clientX - x0;
      const dy = t.clientY - y0;
      x0=null; y0=null;
      if (Math.abs(dy) > Math.abs(dx)) return;
      if (dx < -35) go(idx+1);
      else if (dx > 35) go(idx-1);
    }, {passive:true});

    // Keyboard
    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") go(idx+1);
      if (e.key === "ArrowLeft") go(idx-1);
    });

    // Fullscreen
    const fsBtn = document.getElementById("btnFullscreen");
    fsBtn.addEventListener("click", async () => {
      try{
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
          fsBtn.textContent = "전체화면 해제";
        } else {
          await document.exitFullscreen();
          fsBtn.textContent = "전체화면";
        }
      } catch(err){
        alert("이 브라우저에서는 전체화면이 제한될 수 있어요.");
      }
    });

    renderInitial();
  </script>
</body>
</html>
