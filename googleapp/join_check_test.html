<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="UTF-8">
    <title>상견레 참석 여부 회신</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="container mt-5">
    <div class="card p-4 shadow-sm">
      <h2 class="mb-4">상견레 참석 여부 회신</h2>
      <form id="attendanceForm">
        <div class="mb-3">
          <label for="name" class="form-label">이름 선택:</label>
          <select id="name" name="name" class="form-select" required>
            <option value="">-- 이름을 선택하세요 --</option>
            <option value="홍길동">홍길동</option>
            <option value="김철수">김철수</option>
            <option value="이영희">이영희</option>
          </select>
        </div>
        
        <div class="mb-3">
          <label for="attendance" class="form-label">참석 여부:</label>
          <select id="attendance" name="attendance" class="form-select" required>
            <option value="">-- 참석 여부 선택 --</option>
            <option value="예">예</option>
            <option value="아니오">아니오</option>
            <option value="모름">모름</option>
          </select>
        </div>
        
        <button type="submit" id="submitBtn" class="btn btn-primary w-100">✔제출하기</button>
      </form>
    </div>
    
    <script>
        document.getElementById("attendanceForm").onsubmit = function(event) {
            event.preventDefault();
            
            var submitBtn = document.getElementById("submitBtn");
            submitBtn.textContent = "🔄 제출중.. 잠시만 기다려주세요";
            submitBtn.disabled = true;
            
            var formData = new FormData(document.getElementById("attendanceForm"));
            alert('🤷‍♂️제출중입니다. 잠시 후 제출 결과를 확인해 주세요');
            fetch("https://script.google.com/macros/s/AKfycby4XHSzq0IwSB5UKPq5TrJaCt1DFGFETD-MdfCeslNUa_YNesLzYiW4xLTiB5gmcgRi/exec", {
              method: "POST",
              body: formData
            })
            .then(response => response.text())
            .then(data => {
              alert(data);
            })
            .catch(error => {
              console.error("Error:", error);
              alert("회신을 전송하는 동안 오류가 발생했습니다.");
            })
            .finally(() => {
              submitBtn.textContent = "✔제출하기";
              submitBtn.disabled = false;
            });
          };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
