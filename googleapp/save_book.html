<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일정 자동 추가하기</title>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            addEventToCalendar();
        });

        function addEventToCalendar() {
            const title = "신협 임원상견례 모임";
            const startDate = new Date("2025-03-04T17:30:00");
            const endDate = new Date("2025-03-04T19:00:00");
            const description = "신협 신임임원 취임관련 임직원 상견례 (장소: 사계)";
            const location = "";

            // 날짜 포맷 변환 (YYYYMMDDTHHmmssZ)
            function formatDate(date) {
                return date.toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
            }

            const startDateStr = formatDate(startDate);
            const endDateStr = formatDate(endDate);

            if (/android/i.test(navigator.userAgent)) {
                // 안드로이드 환경 (Google Calendar)
                const googleCalendarUrl = `https://www.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${startDateStr}/${endDateStr}&details=${encodeURIComponent(description)}&location=${encodeURIComponent(location)}`;
                window.location.href = googleCalendarUrl;
            } else if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
                // iOS 환경 (Apple Calendar)
                const appleCalendarUrl = `webcal://www.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${startDateStr}/${endDateStr}&details=${encodeURIComponent(description)}&location=${encodeURIComponent(location)}`;
                window.location.href = appleCalendarUrl;
            } else {
                alert("⚠현재 사용하는 기기에서는 자동 일정 추가가 지원되지 않습니다.");
            }
        }
    </script>
</head>
<body style="text-align: center;">
    <h3>📆캘린더에 일정이 자동으로 추가됩니다...<br>
        📤저장해 주세요</h3>
</body>
</html>
