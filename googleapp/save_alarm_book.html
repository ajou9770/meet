<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>알람 앱 열기</title>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            openAlarmApp();
        });

        function openAlarmApp() {
            if (/android/i.test(navigator.userAgent)) {
                // ✅ Android 기본 알람 앱 실행
                alert("Android 알람 앱을 엽니다. 알람을 직접 설정하세요.");
                window.location.href = "clock://alarm";
            } else if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
                // ✅ iOS에서는 단축어(Shortcuts)를 사용하여 실행
                alert("iOS에서는 단축어(Shortcuts)를 사용해야 합니다. 단축어 설정 후 다시 시도하세요.");
                window.location.href = "shortcuts://run-shortcut?name=OpenClockApp";
            } else {
                alert("현재 사용하는 기기에서 기본 알람 앱을 여는 것이 지원되지 않습니다.");
            }
        }
    </script>
</head>
<body>
    <h2>이기기의 기본 알람 앱이 실행됩니다...</h2>
</body>
</html>
