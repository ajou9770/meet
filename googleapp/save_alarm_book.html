<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>알람 자동 추가</title>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            setDeviceAlarm();
        });

        function setDeviceAlarm() {
            const alarmTime = new Date("2025-02-11T11:50:00"); // 10분 전 알람
            const hours = alarmTime.getHours();
            const minutes = alarmTime.getMinutes();

            if (/android/i.test(navigator.userAgent)) {
                // Android에서 알람 앱 실행
                const androidAlarmIntent = `intent://clock/set_alarm?android.intent.extra.alarm.HOUR=${hours}&android.intent.extra.alarm.MINUTES=${minutes}&android.intent.extra.alarm.MESSAGE=${encodeURIComponent("신협선관위모임")}#Intent;scheme=android-app;end;`;
                window.location.href = androidAlarmIntent;
            } else if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
                // iOS에서는 Shortcuts 단축어 URL 사용 (사용자가 설정 필요)
                const iosShortcutURL = "shortcuts://run-shortcut?name=SetEventAlarm&input=2025-02-11T11:50:00";
                window.location.href = iosShortcutURL;
            } else {
                alert("현재 사용하는 기기에서 알람 설정이 지원되지 않습니다.");
            }
        }
    </script>
</head>
<body>
    <h2>알람이 자동으로 추가됩니다...</h2>
</body>
</html>
