<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>알람 앱 열기</title>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            openAlarmApp();
        });

        function openAlarmApp() {
            if (/android/i.test(navigator.userAgent)) {
                alert("Android 알람 앱을 실행합니다. 알람을 직접 추가하세요.");

                // Google Clock (기본 시계 앱) 실행
                /* try {
                    window.location.href = "intent://com.google.android.deskclock#Intent;scheme=android-app;end;";
                } catch (e) {
                    console.log("Google Clock 실행 실패, 삼성 시계 앱 시도");
                } */

                // 삼성 시계 앱 실행 (삼성 기기 전용)
                try {
                    window.location.href = "intent://com.samsung.android.deskclock#Intent;scheme=android-app;end;";
                } catch (e) {
                    console.log("삼성 시계 실행 실패, 기본 시계 앱 시도");
                }

                // 기본 시계 앱 실행 (SHOW_ALARMS 액션)
                try {
                    window.location.href = "intent://com.android.deskclock#Intent;scheme=android-app;end;";
                } catch (e) {
                    alert("기본 알람 앱을 실행할 수 없습니다. 직접 시계 앱을 열어주세요.");
                }

            } else if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
                alert("iOS에서는 단축어(Shortcuts)를 사용해야 합니다. 단축어 설정 후 다시 시도하세요.");
                window.location.href = "shortcuts://run-shortcut?name=OpenClockApp";
            } else {
                alert("현재 사용하는 기기에서 기본 알람 앱을 여는 것이 지원되지 않습니다.");
            }
        }
    </script>
</head>
<body>
    <h2>기본(구글/삼성) 알람 앱이 실행됩니다...</h2>
</body>
</html>
